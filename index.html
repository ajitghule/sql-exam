<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Server Online Exam</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a737d;--ac:#2563eb;--bd:#d8dce1;--ok:#15803d;--no:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2227;--tx:#e8eaed;--mu:#9aa3ad;--ac:#5b8def;--bd:#343a42;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2227;--tx:#e8eaed;--mu:#9aa3ad;--ac:#5b8def;--bd:#343a42;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:140px;resize:vertical}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;margin-bottom:14px}
#tm{font-weight:700;font-variant-numeric:tabular-nums}#tm.lo{color:var(--no)}
.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin:8px 0;cursor:pointer}
.o input{width:auto;margin-top:5px}.o.sel{border-color:var(--ac)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.nav b{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:8px;font-size:14px;cursor:pointer;font-weight:400}
.nav b.d{background:var(--ac);color:#fff;border-color:var(--ac)}.nav b.cur{outline:2px solid var(--tx)}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.mk{color:var(--mu);font-size:14px}.big{font-size:42px;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--no)}.rv{border-top:1px solid var(--bd);padding:12px 0;font-size:15px}
.hide{display:none}h2#q{white-space:pre-line;font-weight:500;line-height:1.5}
</style></head><body><div class="w">

<div id="s1" class="c">
<h1>SQL Server Online Exam</h1>
<div class="mk">20 questions · 40 marks · 30 minutes · all multiple choice</div>
<label>Student name</label><input id="nm">
<label>Student email</label><input id="se" type="email">
<p id="er" class="no"></p><p class="mk">The exam auto-submits when time ends. Don't refresh the page.</p>
<button onclick="start()">Start exam</button>
</div>

<div id="s2" class="hide">
<div class="top"><span id="pg"></span><span>⏱ <span id="tm"></span></span></div>
<div class="c"><div class="mk" id="mt"></div><h2 id="q"></h2><div id="a"></div>
<div class="row"><button class="s" onclick="go(-1)" id="pv">Previous</button><button onclick="go(1)" id="nx">Next</button></div></div>
<div class="c"><div class="mk">Jump to question (filled = answered)</div><div class="nav" id="nv"></div>
<button id="sb" onclick="askSubmit()">Submit exam</button> <span class="mk" id="sw"></span></div>
</div>

<div id="s3" class="hide">
<div class="c"><h1>Result</h1><div id="who" class="mk"></div>
<div class="big" id="sc"></div><div id="gr"></div>
<p id="ms"></p><p id="ms2" class="mk"></p><p class="mk" id="note"></p>

<button id="fb" class="s hide" onclick="mail('t')">Send result to examiner</button></div>

</div>

</div>
<script>
const E='Employees (EmpID, Name, DeptID): (1, Ravi, 10), (2, Sita, 20), (3, Amit, NULL)\nDepartments (DeptID, DeptName): (10, HR), (20, IT), (30, Sales)\n\n';
const C='Customers (CustID, Name): (1, A), (2, B), (3, C)\nOrders (OrderID, CustID): (101, 1), (102, 1), (103, 2)\n\n';
const Q=[
{t:'m',m:1,q:'Which join returns only the rows that have matching values in both tables?',o:['LEFT JOIN','INNER JOIN','FULL OUTER JOIN','CROSS JOIN'],a:1},
{t:'m',m:1,q:'Which statement is used to change the structure of an existing table?',o:['UPDATE TABLE','MODIFY TABLE','ALTER TABLE','CHANGE TABLE'],a:2},
{t:'m',m:1,q:'Which clause specifies the matching condition between two tables in a JOIN?',o:['HAVING','GROUP BY','WITH','ON'],a:3},
{t:'m',m:1,q:'Which statement correctly adds a column Email to the Students table in SQL Server?',o:['ALTER TABLE Students ADD Email VARCHAR(100)','ALTER TABLE Students ADD COLUMN Email VARCHAR(100)','UPDATE TABLE Students ADD Email VARCHAR(100)','INSERT COLUMN Email INTO Students'],a:0},
{t:'m',m:2,q:'Which statement about LEFT JOIN is correct?',o:['It returns only the matching rows','It returns all rows from the left table and the matching rows from the right table; unmatched right-side columns are NULL','It returns all rows from the right table only','It returns the product of both tables'],a:1},
{t:'m',m:2,q:E+'How many rows does this query return?\nSELECT * FROM Employees e INNER JOIN Departments d ON e.DeptID = d.DeptID',o:['1','2','3','4'],a:1},
{t:'m',m:2,q:E+'How many rows does this query return?\nSELECT * FROM Employees e LEFT JOIN Departments d ON e.DeptID = d.DeptID',o:['3','2','4','9'],a:0},
{t:'m',m:2,q:E+'How many rows does this query return?\nSELECT * FROM Employees e FULL OUTER JOIN Departments d ON e.DeptID = d.DeptID',o:['5','3','6','4'],a:3},
{t:'m',m:2,q:E+'How many rows does this query return?\nSELECT * FROM Employees CROSS JOIN Departments',o:['3','6','9','12'],a:2},
{t:'m',m:2,q:E+'Which query lists the employees who have NO department?',o:['SELECT e.Name FROM Employees e INNER JOIN Departments d ON e.DeptID = d.DeptID WHERE d.DeptID IS NULL','SELECT e.Name FROM Employees e LEFT JOIN Departments d ON e.DeptID = d.DeptID WHERE d.DeptID = NULL','SELECT e.Name FROM Employees e LEFT JOIN Departments d ON e.DeptID = d.DeptID WHERE d.DeptID IS NULL','SELECT e.Name FROM Employees e CROSS JOIN Departments d WHERE d.DeptID IS NULL'],a:2},
{t:'m',m:2,q:E+'Which query lists the departments that have NO employees?',o:['SELECT d.DeptName FROM Departments d INNER JOIN Employees e ON d.DeptID = e.DeptID WHERE e.EmpID IS NULL','SELECT d.DeptName FROM Employees e LEFT JOIN Departments d ON e.DeptID = d.DeptID WHERE e.EmpID IS NULL','SELECT d.DeptName FROM Departments d LEFT JOIN Employees e ON d.DeptID = e.DeptID WHERE e.EmpID = 0','SELECT d.DeptName FROM Departments d LEFT JOIN Employees e ON d.DeptID = e.DeptID WHERE e.EmpID IS NULL'],a:3},
{t:'m',m:2,q:'Which is the correct way to rename the column Name to FullName in the Students table in SQL Server?',o:['ALTER TABLE Students RENAME COLUMN Name TO FullName',"EXEC sp_rename 'Students.Name', 'FullName', 'COLUMN'",'ALTER TABLE Students CHANGE Name FullName','UPDATE Students RENAME Name TO FullName'],a:1},
{t:'m',m:2,q:'Which statement changes the data type of the Age column in the Students table to BIGINT?',o:['ALTER TABLE Students MODIFY COLUMN Age BIGINT','ALTER TABLE Students CHANGE Age BIGINT','ALTER TABLE Students ALTER COLUMN Age BIGINT','UPDATE TABLE Students SET Age BIGINT'],a:2},
{t:'m',m:2,q:'Which statement removes the column Phone from the Students table?',o:['ALTER TABLE Students DROP Phone','ALTER TABLE Students REMOVE COLUMN Phone','ALTER TABLE Students DELETE COLUMN Phone','ALTER TABLE Students DROP COLUMN Phone'],a:3},
{t:'m',m:2,q:'Which statement adds a primary key on StudentID to an existing Students table?',o:['ALTER TABLE Students ADD CONSTRAINT PK_Students PRIMARY KEY (StudentID)','ALTER TABLE Students ADD PRIMARY KEY CONSTRAINT (StudentID)','ALTER TABLE Students SET PRIMARY KEY StudentID','ALTER TABLE Students PRIMARY KEY = StudentID'],a:0},
{t:'m',m:2,q:"The Employees table has (EmpID, Name, ManagerID). How do you list each employee together with their manager's name?",o:['Use UNION of the table with itself','Join the table to itself using two different aliases','Use GROUP BY ManagerID only','It is not possible in SQL Server'],a:1},
{t:'m',m:3,q:'The Students table already contains rows. Which statement correctly adds a NOT NULL column Status in SQL Server?',o:['ALTER TABLE Students ADD Status VARCHAR(10) NOT NULL','ALTER TABLE Students ADD Status VARCHAR(10) NOT NULL DEFAULT \'Active\'','ALTER TABLE Students ADD COLUMN Status VARCHAR(10) NOT NULL','ALTER TABLE Students ALTER COLUMN ADD Status VARCHAR(10) NOT NULL'],a:1},
{t:'m',m:3,q:C+'What does this query return?\nSELECT c.Name, COUNT(o.OrderID) AS Total FROM Customers c LEFT JOIN Orders o ON c.CustID = o.CustID GROUP BY c.Name',o:['A = 3, B = 3, C = 3','A = 2, B = 1 (C is not shown)','A = 2, B = 1, C = 0','A = 1, B = 1, C = 1'],a:2},
{t:'m',m:3,q:C+'How many rows does this query return?\nSELECT c.Name, o.OrderID FROM Customers c LEFT JOIN Orders o ON c.CustID = o.CustID AND o.OrderID = 101',o:['1','2','4','3'],a:3},
{t:'m',m:3,q:'Which statement adds a foreign key on Orders(CustID) that references Customers(CustID)?',o:['ALTER TABLE Orders ADD FOREIGN KEY Customers(CustID)','ALTER TABLE Orders ADD CONSTRAINT FK_Orders FOREIGN KEY CustID REFERENCES Customers','ALTER TABLE Orders ADD CONSTRAINT FK_Orders_Customers FOREIGN KEY (CustID) REFERENCES Customers(CustID)','ALTER TABLE Orders ADD REFERENCES Customers(CustID) AS FOREIGN KEY'],a:2}
];
// ===== EXAMINER CONFIG: set the examiner/teacher email here (students cannot see or change it) =====
const EXAMINER_EMAIL='ajitghule113@gmail.com';
// Paste your Google Apps Script Web App URL here (see setup steps). Use the same secret as in the script.
const MAIL_WEBAPP_URL='https://script.google.com/macros/library/d/12C6rh59xqo6j0SbPAI9kwxW54H-poAetVNGOOhZ3JqXTrZX3OYAwAQ1e/1';
const MAIL_KEY='exam2026secret';
const DUR=30*60;let i=0,ans=[],left=DUR,tk,st={};
const $=id=>document.getElementById(id);
function start(){
 st={n:$('nm').value.trim(),s:$('se').value.trim(),t:EXAMINER_EMAIL};
 if(!st.n||!/^\S+@\S+\.\S+$/.test(st.s)){$('er').textContent='Please enter your name and a valid email.';return}
 ans=Q.map(()=>null);$('s1').classList.add('hide');$('s2').classList.remove('hide');
 tick();tk=setInterval(tick,1000);show();
}
function tick(){
 const m=Math.floor(left/60),s=left%60;$('tm').textContent=m+':'+String(s).padStart(2,'0');
 $('tm').className=left<=300?'lo':'';
 if(left--<=0){clearInterval(tk);finish()}
}
function show(){
 const q=Q[i];$('pg').textContent='Question '+(i+1)+' of '+Q.length;
 $('mt').textContent=(q.t=='m'?'Multiple choice':'Descriptive')+' · '+q.m+' mark'+(q.m>1?'s':'');
 $('q').textContent=q.q;const a=$('a');a.innerHTML='';
 if(q.t=='m'){q.o.forEach((o,j)=>{const l=document.createElement('label');l.className='o'+(ans[i]===j?' sel':'');l.style.color='var(--tx)';l.style.fontSize='16px';
  l.innerHTML='<input type="radio" name="r"'+(ans[i]===j?' checked':'')+'><span></span>';l.querySelector('span').textContent=o;
  l.onclick=()=>{ans[i]=j;show()};a.appendChild(l)})}
 else{const t=document.createElement('textarea');t.placeholder='Type your answer here…';t.value=ans[i]||'';t.oninput=()=>{ans[i]=t.value;nav()};a.appendChild(t)}
 $('pv').disabled=i==0;$('nx').disabled=i==Q.length-1;nav();
}
function nav(){
 $('nv').innerHTML='';Q.forEach((_,j)=>{const b=document.createElement('b');b.textContent=j+1;
  b.className=(ans[j]!==null&&ans[j]!==''?'d ':'')+(j==i?'cur':'');b.onclick=()=>{i=j;show()};$('nv').appendChild(b)});
}
function go(d){i+=d;show()}
let armed=false,at;
function askSubmit(){
 if(!armed){const n=ans.filter(a=>a!==null&&a!=='').length;armed=true;$('sb').textContent='Click again to confirm submit';$('sw').textContent=n+' of '+Q.length+' answered';at=setTimeout(()=>{armed=false;$('sb').textContent='Submit exam';$('sw').textContent=''},6000);return}
 clearTimeout(at);finish();
}
function finish(){
 clearInterval(tk);if(window.__d)return;window.__d=1;window.scrollTo(0,0);let tot=0,max=0,html='';
 Q.forEach((q,j)=>{max+=q.m;let g=0,line='';
  if(q.t=='m'){g=ans[j]===q.a?q.m:0;
   line=(ans[j]===null?'Not answered':'Your answer: '+q.o[ans[j]])+' | Correct: '+q.o[q.a]}
  else{const t=(ans[j]||'').toLowerCase();const hit=q.k.filter(k=>t.includes(k)).length;
   g=Math.round(Math.min(1,hit/(q.k.length*0.7))*q.m*2)/2;
   line='Provisional keyword score ('+hit+'/'+q.k.length+' key points found). Teacher to confirm.'}
  tot+=g;(st.gs=st.gs||[]).push(g);
  html+='<div class="rv"><b>Q'+(j+1)+'.</b> '+esc(q.q)+'<br><span class="'+(g==q.m?'ok':g>0?'':'no')+'">'+g+' / '+q.m+'</span> — '+esc(line)+'</div>'});
 st.tot=tot;st.max=max;st.pct=Math.round(tot/max*100);
 $('s2').classList.add('hide');$('s3').classList.remove('hide');
 $('who').textContent=st.n+' · '+st.s;$('sc').textContent=tot+' / '+max+'  ('+st.pct+'%)';
 const p=st.pct;st.gr=p>=75?'Distinction':p>=60?'First class':p>=40?'Pass':'Fail';
 $('gr').innerHTML='<b class="'+(p>=40?'ok':'no')+'">'+st.gr+'</b>';
 $('note').textContent='';
 st.sum=Q.map((q,j)=>'Q'+(j+1)+': '+(q.t=='m'?(ans[j]===q.a?q.m:0):'descriptive')+'/'+q.m).join(', ');st.rep=buildReport();sendResult();
}
function buildReport(){
 const L=['SQL SERVER ONLINE EXAM - RESULT REPORT','','Student: '+st.n,'Student email: '+st.s,'Examiner email: '+st.t,'Submitted: '+new Date().toLocaleString(),'Score: '+st.tot+' / '+st.max+' ('+st.pct+'%)','Grade: '+st.gr,'','QUESTION-WISE DETAILS','='.repeat(40)];
 Q.forEach((q,j)=>{
  L.push('','Q'+(j+1)+' ['+(q.t=='m'?'MCQ':'Descriptive')+'] ('+st.gs[j]+' / '+q.m+' marks)','Question: '+q.q);
  if(q.t=='m'){L.push('Student answer: '+(ans[j]===null?'Not answered':q.o[ans[j]]),'Correct answer: '+q.o[q.a],'Result: '+(ans[j]===q.a?'Correct':'Wrong'))}
  else{L.push('Student answer: '+(ans[j]&&ans[j].trim()?ans[j].trim():'Not answered'),'Expected key points: '+q.k.join(', '))}
 });
 return L.join('\n');
}
async function dl(){
 const fn='SQL-Exam-Result-'+st.n.replace(/[^\w]+/g,'_')+'.txt',m=$('ms2');
 if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([st.rep],{type:'text/plain'}));a.download=fn;a.click();return}
 const d=await claude.use('downloads');
 if(!d){m.textContent='Download is not available in this view.';return}
 try{await d.save({filename:fn,data:st.rep});m.textContent='Report saved. Attach it to your email to the instructor.'}
 catch(e){m.textContent=(e&&e.code=='declined')?'Download cancelled.':'Could not save the report.'}
}
async function sendResult(){
 const el=$('ms');el.textContent='Sending result by email…';
 if(MAIL_WEBAPP_URL){
  try{await fetch(MAIL_WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:MAIL_KEY,cc:st.s,subject:'SQL Server Exam Result - '+st.n,body:st.rep,summary:'Hello '+st.n+',\n\nYour SQL Server exam is complete.\nScore: '+st.tot+' / '+st.max+' ('+st.pct+'%)\nGrade: '+st.gr+''})});
   el.innerHTML='<span class="ok">✔ Result submitted. The examiner is being sent the full report, and a marks summary is being emailed to you.</span>'}
  catch(e){el.innerHTML='<span class="no">Could not reach the mail service.</span> Use the button below to send it from your mail app.';$('fb').classList.remove('hide')}
  return}
 try{
  const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(EXAMINER_EMAIL),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'SQL Server Exam Result - '+st.n,_template:'table',Name:st.n,'Student email':st.s,Score:st.tot+' / '+st.max+' ('+st.pct+'%)',Grade:st.gr,Report:st.rep})});
  const j=await r.json();
  if(r.ok&&(j.success===true||j.success==='true')){el.innerHTML='<span class="ok">✔ Result emailed to the examiner.</span>';return}
  throw 0;
 }catch(e){el.innerHTML='<span class="no">Automatic email could not be sent from this page.</span> Use the button below to send it from your mail app.';$('fb').classList.remove('hide')}
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function mail(w){
 const to=w=='s'?st.s:st.t;const body2=st.rep.length<1600?st.rep:st.rep.slice(0,st.rep.indexOf('QUESTION-WISE DETAILS'))+'The full question-by-question report is attached (downloaded from the result page).\n';
 const body='SQL Server Exam Result\n\nName: '+st.n+'\nScore: '+st.tot+' / '+st.max+' ('+st.pct+'%)\nGrade: '+st.gr+'\n\nBreakdown: '+st.sum+'';
 const a=document.createElement('a');a.href='mailto:'+to+'?subject='+encodeURIComponent('SQL Server Exam Result - '+st.n)+'&body='+encodeURIComponent(body2);a.target='_blank';document.body.appendChild(a);a.click();a.remove();
}
</script></body></html>
